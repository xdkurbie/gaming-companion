name: Build & Release
on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Build exe
        run: >
          pyinstaller --onefile --name GamingCompanion
          --add-data "gaming_companion/profiles;gaming_companion/profiles"
          --collect-submodules pynput --collect-submodules gaming_companion
          --hidden-import pydirectinput
          run_companion.py
      - name: Smoke test exe
        run: dist\GamingCompanion.exe skills
      - uses: actions/upload-artifact@v4
        with: { name: GamingCompanion, path: dist/GamingCompanion.exe }
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/GamingCompanion.exe
          generate_release_notes: true
